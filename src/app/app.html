<header>
    <h1 routerLink="/">gamescape</h1>

    <nav>
        @if (isAuthenticated()) {
        @if (user()) {
        <button secondary routerLink="/user">{{ user()?.firstName }} {{ user()?.lastName }}</button>
        }
        <button (click)="logOut()">Ausloggen</button>
        } @else {
        <button routerLink="/signup">Anmelden</button>
        <button routerLink="/login">Einloggen</button>
        }
    </nav>
</header>

<router-outlet></router-outlet>
