@if (user()) {
<header>
    <h2>{{ user()?.firstName }} {{ user()?.lastName }}</h2>
    <h3>{{ user()?.email }}</h3>
</header>

<button (click)="updateUser()">Benutzer ändern</button>
<button (click)="updateEmail()">Email ändern</button>
<button (click)="updatePassword()">Password ändern</button>
<button (click)="deleteUser()">Löschen</button>
}
