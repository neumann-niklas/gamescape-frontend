@if (user(); as user) {
<header>
    <p>Name: {{ user.firstName }} {{ user.lastName }}</p>
    <p>Email: {{ user.email }}</p>
    <p>Rolle: {{ getRole(user.role) }}</p>
</header>

<section>
    <button routerLink="/update-user">Benutzer bearbeiten</button>
    <button routerLink="/update-email">Email ändern</button>
    <button routerLink="/update-password">Password ändern</button>
    <button (click)="onDeleteUser()">Löschen</button>
</section>
}
