<header>
    @if (isAuthenticated()) {
    <button routerLink="/add-game" secondary type="button">Spiel hinzufügen</button>
    }
</header>

<section>
    @for (game of games(); track game.id) {
    <div class="game-card">
        <header>
            <h3>{{ game.title }}</h3>
            <span>{{ game.groupPhase }}</span>
        </header>
    </div>
    }
</section>
