@for (game of games(); track game.id) {
<div class="game-card" [routerLink]="game.id">
    <header>
        <h3>{{ game.title }}</h3>

        <app-group-phase [groupPhase]="game.groupPhase"></app-group-phase>
    </header>

    <section>
        <div class="game-categories">
            <app-category [category]="game.category"></app-category>
        </div>

        <span class="game-date">{{ game.updateDate | date:'d/M/yy' }}</span>
    </section>
</div>
}
