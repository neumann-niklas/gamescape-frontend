<table>
    <thead>
        <tr>
            <th>Titel</th>
            <th>Gruppenphase</th>
        </tr>
    </thead>

    <tbody>
        @for (game of games(); track game.id) {
        <tr>
            <td>{{ game.title }}</td>
            <td>
                <app-group-phase [groupPhase]="game.groupPhase"></app-group-phase>
            </td>
        </tr>
        }
    </tbody>
</table>
