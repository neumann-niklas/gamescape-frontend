<table>
    <thead>
        <tr>
            <th>Titel</th>

            <th>Gruppenphase</th>

            <th>Kategorien</th>

            <th>Datum</th>
        </tr>
    </thead>

    <tbody>
        @for (game of games(); track game.id) {
        <tr>
            <td>{{ game.title }}</td>

            <td>
                <app-group-phase [groupPhase]="game.groupPhase"></app-group-phase>
            </td>

            <td>
                <span class="game-categories">
                    @for (category of game.categories; track category.id) {
                    <app-category [category]="category"></app-category>
                    }
                </span>
            </td>

            <td>{{ game.updateDate | date:'d/M/y' }}</td>
        </tr>
        }
    </tbody>
</table>
